name: airline

# One-command full stack: Postgres + Redis + Laravel API + queue worker + React frontend.
#   docker compose up --build
# Then open http://localhost:8080  (API at http://localhost:8000/api)

x-backend-env: &backend-env
  APP_NAME: Avion
  APP_ENV: local
  APP_DEBUG: "true"
  APP_KEY: base64:EBoMkjfDn5nBGqO8ORnc5mmrsXMji9mc/lNjUF5FOJc=
  APP_URL: http://localhost:8000
  LOG_CHANNEL: stderr
  DB_CONNECTION: pgsql
  DB_HOST: db
  DB_PORT: "5432"
  DB_DATABASE: airline
  DB_USERNAME: airline
  DB_PASSWORD: secret
  CACHE_STORE: redis
  QUEUE_CONNECTION: redis
  SESSION_DRIVER: redis
  REDIS_CLIENT: predis
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  MONGO_DB_URI: mongodb://mongo:27017
  MONGO_DB_DATABASE: airline_logs
  CORS_ALLOWED_ORIGINS: http://localhost:8080

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: airline
      POSTGRES_USER: airline
      POSTGRES_PASSWORD: secret
    ports:
      - "5433:5432"   # host 5433 -> container 5432 (avoids clash with native Postgres on 5432)
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airline -d airline"]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  mongo:
    image: mongo:7
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 5s
      timeout: 5s
      retries: 15
    restart: unless-stopped

  backend:
    build:
      context: .
    environment:
      <<: *backend-env
      RUN_MIGRATIONS: "true"   # this service runs migrations + first-time seed
      DB_SEED: "true"
    ports:
      - "8000:80"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy
    restart: unless-stopped

  queue:
    build:
      context: .
    command: php artisan queue:work --tries=3 --timeout=90 --sleep=3
    environment:
      <<: *backend-env
      RUN_MIGRATIONS: "false"
      DB_SEED: "false"
    depends_on:
      backend:
        condition: service_started
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      # The user's working frontend copy (confirmed 2026-07-28). Override with
      # FRONTEND_CONTEXT if it moves.
      context: "${FRONTEND_CONTEXT:-../Documents/Multi-role web app design}"
      args:
        VITE_API_URL: http://localhost:8000/api
        VITE_ENABLE_MOCKS: "false"
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  dbdata:
  mongodata:
